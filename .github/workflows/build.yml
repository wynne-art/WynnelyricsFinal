name: Build WynLyrics Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate or extract Gradle project
        id: locate
        run: |
          BUILD_FILE=$(find . -maxdepth 4 -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p _extracted
              unzip -q "$ZIP_FILE" -d _extracted
              BUILD_FILE=$(find _extracted -maxdepth 4 -name "build.gradle" | head -n 1)
            fi
          fi
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle tidak ditemukan di repositori!"
            exit 1
          fi
          echo "dir=$(dirname "$BUILD_FILE")" >> "$GITHUB_OUTPUT"

      - name: Build mod JAR
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: wynlyrics-1.21.1-jar
          path: "**/build/libs/*.jar"
